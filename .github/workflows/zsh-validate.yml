name: Validate Nix and Zsh configuration

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "darwin/**/*.nix"
      - "home/**/*.nix"
      - "home/cli-tools/scripts/**"
      - "home/zsh/**"
      - "home/dev/languages/cpp/**"
      - "hosts/**/*.nix"
      - "scripts/**"
      - "home/out-of-store-allowlist.tsv"
      - "home/package-ownership-allowlist.tsv"
      - ".github/workflows/zsh-validate.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "darwin/**/*.nix"
      - "home/**/*.nix"
      - "home/cli-tools/scripts/**"
      - "home/zsh/**"
      - "home/dev/languages/cpp/**"
      - "hosts/**/*.nix"
      - "scripts/**"
      - "home/out-of-store-allowlist.tsv"
      - "home/package-ownership-allowlist.tsv"
      - ".github/workflows/zsh-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix policy and evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting, lint, and state boundaries
        run: |
          nix develop .#ci --command bash -euo pipefail -c '
            mapfile -t nix_files < <(find flake.nix darwin home hosts -type f -name "*.nix" | sort)
            nixfmt --check "${nix_files[@]}"
            statix check .
            deadnix --fail flake.nix darwin home hosts
            bash scripts/check-out-of-store-allowlist.sh
            bash scripts/check-package-ownership-policy.sh
            bash scripts/check-declared-secrets.sh
            bash scripts/tests/run.sh
            shellcheck scripts/*.sh scripts/tests/*.sh home/cli-tools/scripts/*.sh
          '

      - name: Evaluate every flake output
        run: nix flake check --no-build --all-systems --show-trace

      # GCC and LLVM must come from the binary cache: building GCC locally has
      # failed on the workstation before. A nixpkgs update that leaves the
      # selected releases unbuilt fails here, before anyone switches to it; a
      # newer GCC in nixpkgs is only reported, since adopting it is a choice.
      - name: Check that the C/C++ toolchain is prebuilt
        shell: bash
        run: |
          status=0
          for system in aarch64-darwin x86_64-linux; do
            report="$(nix eval --raw --impure --expr "
              let
                pkgs = (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.$system;
                inherit (pkgs) lib;
                toolchain = import ./home/dev/toolchains/cc-toolchain.nix pkgs;
                gccMajors = map (name: lib.toInt (lib.removePrefix \"gcc\" name)) (
                  builtins.filter (name: builtins.match \"gcc[0-9]+\" name != null) (builtins.attrNames pkgs)
                );
                paths = [
                  toolchain.gcc.cc
                  toolchain.llvmPackages.clang-unwrapped
                  toolchain.llvmPackages.lld
                  toolchain.llvmPackages.compiler-rt
                ];
              in
              lib.concatLines (
                map (path: \"path \${path}\") paths
                ++ [
                  \"selected-gcc \${lib.versions.major toolchain.gcc.version}\"
                  \"newest-gcc \${toString (lib.foldl' lib.max 0 gccMajors)}\"
                ]
              )")"
            while read -r kind value; do
              case "$kind" in
                path)
                  if ! nix path-info --store https://cache.nixos.org "$value" >/dev/null 2>&1; then
                    echo "::error::$system: ${value#*-} is not in cache.nixos.org and would be built locally"
                    status=1
                  fi
                  ;;
                selected-gcc) selected="$value" ;;
                newest-gcc)
                  if (( value > selected )); then
                    echo "::notice::$system: nixpkgs offers gcc$value; home/dev/toolchains/cc-toolchain.nix selects gcc$selected"
                  fi
                  ;;
              esac
            done <<<"$report"
          done
          exit "$status"

      # `nix flake check --no-build` stops at evaluation, so a check derivation
      # that evaluates cleanly still never runs. Build the ones that are cheap
      # enough for a runner; cpp-tools' checkPhase is its Zsh test suite.
      - name: Build the Linux check derivations
        run: nix build --no-link --print-out-paths --print-build-logs .#checks.x86_64-linux.cpp-tools

  darwin:
    name: Darwin check derivations
    # Pinned rather than macos-latest: the toolchain check links with LLD end
    # to end only on an SDK LLD can read (see lld in home/dev/toolchains/cc-toolchain.nix),
    # which the workstation's newer SDK does not. Moving the runner is a
    # decision about that coverage, not something a label change does silently.
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The reason this job exists: the toolchain smoke test compiles, links,
      # and runs real binaries to verify the host SDK selection, the deployment
      # target, and the Apple linker selection. No Linux runner can do that, and the
      # full darwin-configuration check is too heavy for CI -- that one stays a
      # local `nix build --no-link` before switching.
      - name: Build the Darwin check derivations
        run: |
          nix build --no-link --print-out-paths --print-build-logs \
            '.#checks.aarch64-darwin.cpp-tools' \
            '.#checks.aarch64-darwin.llvm-darwin-toolchain'

  zsh:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Linux validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh gawk

      - name: Install macOS validation dependencies
        if: runner.os == 'macOS'
        run: brew install gawk

      - name: Install pinned shdoc
        run: |
          zsh home/zsh/config/scripts/install-shdoc.zsh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shdoc" --version

      - name: Check dependency contract
        run: |
          home/zsh/config/scripts/check-zsh-dependencies.zsh \
            --required --check-manifests

      - name: Run complete verification suite
        run: home/zsh/config/tests/run-all.zsh --full
