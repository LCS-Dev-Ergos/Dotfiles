name: Validate Nix and Zsh Configuration

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "darwin/**/*.nix"
      - "home/**/*.nix"
      - "home/cli/cli-tools/scripts/**"
      - "home/shells/zsh/**"
      - "home/shells/starship/**"
      - "home/file-managers/nnn/**"
      - "home/terminals/kitty/**"
      - "home/editors/doom/**"
      - "home/desktop/hyprdots/**"
      - "home/dev/languages/cpp/**"
      - "home/dev/bootstrap/**"
      - "hosts/**/*.nix"
      - "scripts/**"
      - "home/out-of-store-allowlist.tsv"
      - "home/package-ownership-allowlist.tsv"
      - ".github/workflows/zsh-validate.yml"
      - ".github/workflows/development-bootstrap.yml"
      - ".github/workflows/runtime-baseline-freshness.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "darwin/**/*.nix"
      - "home/**/*.nix"
      - "home/cli/cli-tools/scripts/**"
      - "home/shells/zsh/**"
      - "home/shells/starship/**"
      - "home/file-managers/nnn/**"
      - "home/terminals/kitty/**"
      - "home/editors/doom/**"
      - "home/desktop/hyprdots/**"
      - "home/dev/languages/cpp/**"
      - "home/dev/bootstrap/**"
      - "hosts/**/*.nix"
      - "scripts/**"
      - "home/out-of-store-allowlist.tsv"
      - "home/package-ownership-allowlist.tsv"
      - ".github/workflows/zsh-validate.yml"
      - ".github/workflows/development-bootstrap.yml"
      - ".github/workflows/runtime-baseline-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    # Keep the existing status-check name; full evaluation is a separate job.
    name: Nix policy and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Check formatting, lint, and state boundaries
        run: |
          # The outer shell must leave expressions for the nested Bash process.
          # shellcheck disable=SC2016
          nix develop --impure \
            --expr 'import ./scripts/development-bootstrap.nix { target = "ci"; }' \
            --command bash -euo pipefail -c '
            mapfile -t nix_files < <(find flake.nix darwin home hosts -type f -name "*.nix" | sort)
            nixfmt --check "${nix_files[@]}" scripts/development-bootstrap.nix
            actionlint .github/workflows/development-bootstrap.yml .github/workflows/development-bootstrap-native.yml .github/workflows/zsh-validate.yml .github/workflows/runtime-baseline-freshness.yml
            ruff check --isolated --target-version py313 --select E4,E7,E9,F,B home/dev/bootstrap scripts/update-runtime-baseline.py scripts/tests/test_update_runtime_baseline.py
            ruff format --isolated --target-version py313 --line-length 79 --check home/dev/bootstrap scripts/update-runtime-baseline.py scripts/tests/test_update_runtime_baseline.py
            statix check .
            deadnix --fail flake.nix darwin home hosts
            bash scripts/check-out-of-store-allowlist.sh
            bash scripts/check-package-ownership-policy.sh
            bash scripts/check-declared-secrets.sh
            bash scripts/tests/run.sh
            shellcheck scripts/*.sh scripts/tests/*.sh home/cli/cli-tools/scripts/*.sh
          '

      # GCC and LLVM must come from the binary cache: building GCC locally has
      # failed on the workstation before. A nixpkgs update that leaves the
      # selected releases unbuilt fails here, before anyone switches to it; a
      # newer GCC in nixpkgs is only reported, since adopting it is a choice.
      - name: Check that the pinned toolchains are prebuilt and current
        shell: bash
        run: |
          status=0
          for system in aarch64-darwin x86_64-linux; do
            report="$(nix eval --raw --impure --expr "
              let
                lock = builtins.fromJSON (builtins.readFile ./flake.lock);
                source = builtins.fetchTree lock.nodes.nixpkgs.locked;
                pkgs = import source { system = \"$system\"; };
                inherit (pkgs) lib;
                toolchain = import ./home/dev/toolchains/cc-toolchain.nix pkgs;
                # Highest N among the attributes named <prefix>N.
                newest = prefix: lib.foldl' lib.max 0 (
                  map (name: lib.toInt (lib.removePrefix prefix name)) (
                    builtins.filter (name: builtins.match \"\${prefix}[0-9]+\" name != null) (builtins.attrNames pkgs)
                  )
                );
                go = builtins.head (import ./home/dev/languages/go/default.nix { inherit pkgs; }).home.packages;
                paths = [
                  toolchain.gcc.cc
                  toolchain.llvmPackages.clang-unwrapped
                  toolchain.llvmPackages.lld
                  toolchain.llvmPackages.compiler-rt
                ];
              in
              lib.concatLines (
                map (path: \"path \${path}\") paths
                ++ [
                  \"selected-gcc \${lib.versions.major toolchain.gcc.version}\"
                  \"newest-gcc \${toString (newest \"gcc\")}\"
                  \"selected-llvm \${lib.versions.major toolchain.llvmPackages.llvm.version}\"
                  \"newest-llvm \${toString (newest \"llvmPackages_\")}\"
                  \"selected-go \${lib.versions.minor go.version}\"
                  \"newest-go \${toString (newest \"go_1_\")}\"
                ]
              )")"
            while read -r kind value; do
              case "$kind" in
                path)
                  if ! nix path-info --store https://cache.nixos.org "$value" >/dev/null 2>&1; then
                    echo "::error::$system: ${value#*-} is not in cache.nixos.org and would be built locally"
                    status=1
                  fi
                  ;;
                selected-gcc) selected_gcc="$value" ;;
                newest-gcc)
                  if (( value > selected_gcc )); then
                    echo "::notice::$system: nixpkgs offers gcc$value; home/dev/toolchains/cc-toolchain.nix selects gcc$selected_gcc"
                  fi
                  ;;
                selected-llvm) selected_llvm="$value" ;;
                newest-llvm)
                  if (( value > selected_llvm )); then
                    echo "::notice::$system: nixpkgs offers llvmPackages_$value; home/dev/toolchains/cc-toolchain.nix selects llvmPackages_$selected_llvm (re-verify the LLD SDK ceiling before bumping)"
                  fi
                  ;;
                selected-go) selected_go="$value" ;;
                newest-go)
                  if (( value > selected_go )); then
                    echo "::notice::$system: nixpkgs offers go_1_$value; home/dev/languages/go selects go_1_$selected_go"
                  fi
                  ;;
              esac
            done <<<"$report"
          done
          exit "$status"

      # `nix flake check --no-build` stops at evaluation, so a check derivation
      # that evaluates cleanly still never runs. Build the ones that are cheap
      # enough for a runner; cpp-tools' checkPhase is its Zsh test suite.
      - name: Build the Linux check derivations
        run: |
          nix build --impure --file scripts/development-bootstrap.nix \
            --argstr target cpp-tools --no-link --print-out-paths --print-build-logs

  configuration:
    name: Full configuration evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Evaluate every flake output
        run: nix flake check --no-build --all-systems --show-trace

  darwin:
    name: Darwin check derivations
    # Pinned rather than macos-latest: the toolchain check links with LLD end
    # to end only on an SDK LLD can read (see lld in home/dev/toolchains/cc-toolchain.nix),
    # which the workstation's newer SDK does not. Moving the runner is a
    # decision about that coverage, not something a label change does silently.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      # The reason this job exists: the toolchain smoke test compiles, links,
      # and runs real binaries to verify the host SDK selection, the deployment
      # target, and the Apple linker selection. No Linux runner can do that, and the
      # full darwin-configuration check is too heavy for CI -- that one stays a
      # local `nix build --no-link` before switching.
      - name: Build the Darwin check derivations
        run: |
          nix build --no-link --print-out-paths --print-build-logs \
            '.#checks.aarch64-darwin.cpp-tools' \
            '.#checks.aarch64-darwin.llvm-darwin-toolchain'

  zsh:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Linux validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh gawk

      - name: Install macOS validation dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bash gawk coreutils findutils gnu-sed
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          # Linux desktop fixtures exercise scripts using GNU sed -i syntax.
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install pinned shdoc
        run: |
          zsh home/shells/zsh/config/scripts/install-shdoc.zsh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shdoc" --version

      - name: Check dependency contract
        run: |
          home/shells/zsh/config/scripts/check-zsh-dependencies.zsh \
            --required --check-manifests

      - name: Run complete verification suite
        run: home/shells/zsh/config/tests/run-all.zsh --full

      - name: Run workstation security regressions
        run: |
          python3 scripts/tests/security_regressions.py
          python3 home/terminals/kitty/tests/test_statwell_snapshot.py
