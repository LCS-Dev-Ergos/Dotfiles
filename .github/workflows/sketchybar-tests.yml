name: SketchyBar helper regressions

on:
  push:
    paths:
      - "home/desktop/sketchybar/**"
      - ".github/workflows/sketchybar-tests.yml"
  pull_request:
    paths:
      - "home/desktop/sketchybar/**"
      - ".github/workflows/sketchybar-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    name: Helpers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4 shellcheck
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew install lua shellcheck
      - name: Run helper and widget regressions
        run: bash home/desktop/sketchybar/tests/run.sh
      - name: Check shell helpers
        run: |
          shellcheck home/desktop/sketchybar/tests/run.sh \
            home/desktop/sketchybar/sketchybar/helpers/brew_action.sh
