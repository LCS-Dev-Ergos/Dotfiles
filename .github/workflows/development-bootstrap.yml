name: Development Bootstrap Contracts

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "home/dev/**"
      - "home/shells/zsh/**"
      - "scripts/dev-bootstrap.sh"
      - "scripts/ci-development-bootstrap.*"
      - "scripts/development-bootstrap.nix"
      - "scripts/tests/development-ownership.nix"
      - ".github/workflows/development-bootstrap.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "home/dev/**"
      - "home/shells/zsh/**"
      - "scripts/dev-bootstrap.sh"
      - "scripts/ci-development-bootstrap.*"
      - "scripts/development-bootstrap.nix"
      - "scripts/tests/development-ownership.nix"
      - ".github/workflows/development-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap contracts (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
            architecture: x86_64
          - os: macos-15
            system: aarch64-darwin
            architecture: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # Source contracts evaluate the declared policy with Nix; no store
      # asset is built or fetched in this step.
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Run offline source contracts
        run: bash scripts/ci-development-bootstrap.sh source

      # Uses the locked public nixpkgs directly, without unrelated application
      # inputs. checkPhase/installCheckPhase cover runtime fixtures, setup,
      # effective-shell fixtures and the installed CLI aliases. This is not a
      # clean-host native installation or physical CachyOS qualification.
      - name: Check ownership and build the tested bootstrap package
        run: |
          set -o pipefail
          bash scripts/ci-development-bootstrap.sh package 2>&1 |
            tee "$RUNNER_TEMP/development-bootstrap.log"

      - name: Retain package diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-bootstrap-${{ matrix.system }}
          path: ${{ runner.temp }}/development-bootstrap.log
          if-no-files-found: ignore
          retention-days: 7
