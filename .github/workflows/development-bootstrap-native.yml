name: Development Bootstrap Native

# Real native managers, real downloads and real builds in disposable roots.
# Manual only: each run costs runner minutes, and it is the Linux evidence
# while no Arch/CachyOS workstation is available.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: adapters (from zero), lifecycle (manager updates, package upgrades and user evolution) or interruption (LANGUAGE:SIGINT, LANGUAGE:SIGTERM or LANGUAGE:network[:BYTES] scenarios)
        type: choice
        options: [adapters, lifecycle, interruption]
        default: adapters
      ecosystems:
        description: Ecosystems or interruption scenarios, space-separated within a job and comma-separated between jobs (each ecosystem also selects what it requires)
        required: true
        default: python, ocaml, haskell, node rust lean ruby julia, jvm kotlin maven gradle scala dotnet conda

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The compiler builds (CPython, the OCaml switches) and GHC with HLS each get
  # their own job by default, so every job stays well inside its time limit and
  # one slow ecosystem never delays the others' evidence.
  groups:
    name: Split the ecosystems into jobs
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.split.outputs.groups }}
    env:
      HARNESS: ${{ inputs.harness }}
      REQUEST: ${{ inputs.ecosystems }}
    steps:
      - name: Validate and split the selection
        id: split
        run: |
          groups='[]'
          IFS=',' read -r -a jobs <<< "$REQUEST"
          for job in "${jobs[@]}"; do
            read -r -a members <<< "$job"
            (( ${#members[@]} )) || continue
            for member in "${members[@]}"; do
              ecosystem=${member%%:*}
              case "$ecosystem" in
                node|python|ocaml|rust|haskell|lean|ruby|jvm|kotlin|maven|gradle|scala|julia|dotnet|conda) ;;
                *) echo "Unsupported ecosystem: $ecosystem" >&2; exit 2 ;;
              esac
              if [[ $HARNESS == interruption ]]; then
                [[ $member =~ ^[a-z]+:(SIGINT|SIGTERM|network(:[0-9]+)?)$ ]] || {
                  echo "Unsupported interruption scenario: $member" >&2
                  exit 2
                }
              elif [[ $member != "$ecosystem" ]]; then
                echo "Scenarios need the interruption harness: $member" >&2
                exit 2
              fi
            done
            groups=$(jq -c --arg ecosystems "${members[*]}" \
              --arg id "$(IFS=-; echo "${members[*]//:/-}")" \
              '. + [{id: $id, ecosystems: $ecosystems}]' <<< "$groups")
          done
          if [[ $groups == '[]' ]]; then
            echo 'No ecosystem selected' >&2
            exit 2
          fi
          if [[ $(jq '[.[].id] | length != (unique | length)' <<< "$groups") == true ]]; then
            echo 'A job is listed twice' >&2
            exit 2
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  native:
    name: Native ${{ inputs.harness }} (${{ matrix.platform }}, ${{ matrix.group.ecosystems }})
    needs: groups
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, Arch container]
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
        include:
          - platform: macOS
            os: macos-15
          - platform: Arch container
            os: ubuntu-24.04
    env:
      ECOSYSTEMS: ${{ matrix.group.ecosystems }}
      HARNESS: native-${{ inputs.harness }}.zsh
      # Runner images are disposable, so the lifecycle harness may upgrade
      # native packages there.
      DEV_BOOTSTRAP_PACKAGE_UPGRADES: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Build the bootstrap package
        run: |
          package=$(nix --extra-experimental-features 'nix-command flakes' \
            build --impure --file scripts/bootstrap/development-bootstrap.nix \
            --no-link --print-out-paths)
          echo "DEV_BOOTSTRAP=$package/bin/dev-bootstrap" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native"

      - name: Run the harness on macOS
        if: runner.os == 'macOS'
        run: |
          # shellcheck disable=SC2086
          zsh "home/dev/bootstrap/tests/qualification/$HARNESS" \
            "$DEV_BOOTSTRAP" "$RUNNER_TEMP/native" $ECOSYSTEMS

      # The executor refuses root, so an unprivileged account runs it with
      # passwordless sudo limited to pacman and the credential probe. The
      # store is mounted read-only from the host that built the package.
      - name: Run the harness in an Arch container
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            --volume /nix:/nix:ro \
            --volume "$PWD:/work:ro" \
            --volume "$RUNNER_TEMP/native:/logs" \
            --env DEV_BOOTSTRAP --env ECOSYSTEMS --env HARNESS \
            --env DEV_BOOTSTRAP_PACKAGE_UPGRADES \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed sudo zsh python
              useradd --create-home builder
              printf "builder ALL=(root) NOPASSWD: /usr/bin/pacman, /usr/bin/true\n" \
                > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown builder /logs
              status=0
              cd /tmp
              sudo -u builder -H \
                DEV_BOOTSTRAP_PACKAGE_UPGRADES="$DEV_BOOTSTRAP_PACKAGE_UPGRADES" \
                zsh "/work/home/dev/bootstrap/tests/qualification/$HARNESS" \
                "$DEV_BOOTSTRAP" /logs $ECOSYSTEMS || status=$?
              chmod -R a+rX /logs
              exit "$status"
            '

      - name: Retain harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-bootstrap-${{ inputs.harness }}-${{ matrix.os }}-${{ matrix.group.id }}
          path: ${{ runner.temp }}/native
          if-no-files-found: ignore
          retention-days: 14
