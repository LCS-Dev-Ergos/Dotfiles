name: Development Bootstrap Native

# Real native managers, real downloads and real builds in disposable roots.
# Manual only: each run costs runner minutes, and it is the Linux evidence
# while no Arch/CachyOS workstation is available.
on:
  workflow_dispatch:
    inputs:
      ecosystems:
        description: Space-separated ecosystems for the from-zero harness (each also selects what it requires)
        required: true
        default: node python

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ECOSYSTEMS: ${{ inputs.ecosystems }}

jobs:
  native:
    name: Native harness (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
          - os: ubuntu-24.04
            name: Arch container
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate the selected ecosystems
        run: |
          for ecosystem in $ECOSYSTEMS; do
            case "$ecosystem" in
              node|python|ocaml|rust|haskell|lean|ruby|jvm|kotlin|maven|gradle|julia) ;;
              *) echo "Unsupported ecosystem: $ecosystem" >&2; exit 2 ;;
            esac
          done

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Build the bootstrap package
        run: |
          package=$(nix --extra-experimental-features 'nix-command flakes' \
            build --impure --file scripts/development-bootstrap.nix \
            --no-link --print-out-paths)
          echo "DEV_BOOTSTRAP=$package/bin/dev-bootstrap" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native"

      - name: Run the harness on macOS
        if: runner.os == 'macOS'
        run: |
          # shellcheck disable=SC2086
          zsh home/dev/bootstrap/tests/qualification/native-adapters.zsh \
            "$DEV_BOOTSTRAP" "$RUNNER_TEMP/native" $ECOSYSTEMS

      # The executor refuses root, so an unprivileged account runs it with
      # passwordless sudo limited to pacman and the credential probe. The
      # store is mounted read-only from the host that built the package.
      - name: Run the harness in an Arch container
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            --volume /nix:/nix:ro \
            --volume "$PWD:/work:ro" \
            --volume "$RUNNER_TEMP/native:/logs" \
            --env DEV_BOOTSTRAP --env ECOSYSTEMS \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed sudo zsh python
              useradd --create-home builder
              printf "builder ALL=(root) NOPASSWD: /usr/bin/pacman, /usr/bin/true\n" \
                > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown builder /logs
              status=0
              cd /tmp
              sudo -u builder -H zsh \
                /work/home/dev/bootstrap/tests/qualification/native-adapters.zsh \
                "$DEV_BOOTSTRAP" /logs $ECOSYSTEMS || status=$?
              chmod -R a+rX /logs
              exit "$status"
            '

      - name: Retain harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-bootstrap-native-${{ matrix.os }}
          path: ${{ runner.temp }}/native
          if-no-files-found: ignore
          retention-days: 14
