# =====------------------------------------------------------------------===== #
# +++++++++++++++++++++++++++ KITTY CONFIGURATION ++++++++++++++++++++++++++++ #
# =====------------------------------------------------------------------===== #
#
# Modern terminal emulator configuration optimized for performance and UX.
# Based on official documentation: https://sw.kovidgoyal.net/kitty/conf/
#
# =====------------------------------------------------------------------===== #

# =====----- Typography -------------------------------------------------===== #

# Configure font settings for optimal readability.
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# Keep programming ligatures, but spell them out under the cursor while editing.
disable_ligatures cursor

# Subscripts/superscripts, letterlike symbols, arrows and math operators
symbol_map U+2070-U+209F,U+2100-U+214F,U+2190-U+22FF,U+27C0-U+27EF,U+2980-U+2AFF JuliaMono

# =====----- Performance ------------------------------------------------===== #

# Optimize performance settings for smooth operation.
repaint_delay 8
input_delay 1
sync_to_monitor yes

# =====----- Window Behavior --------------------------------------------===== #

# Customize the appearance and behavior of the terminal window.
hide_window_decorations titlebar-only
window_padding_width 12 6 8 6
remember_window_size yes
initial_window_width 140c
initial_window_height 40c

# Transparency and background.
background_opacity 0.95
background_blur 80
dynamic_background_opacity yes

# Window layout.
# splits comes first so cmd+d / cmd+shift+d split the focused window side by
# side or top to bottom; the other layouts ignore a split's direction.
enabled_layouts splits, tall:bias=50;full_size=1;mirrored=false, fat:bias=50;full_size=1;mirrored=false, grid, horizontal, vertical, stack
window_border_width 1pt
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1
active_border_color #3d59a1
inactive_border_color #2c3352

# =====----- Cursor Settings --------------------------------------------===== #

# Customize the appearance and behavior of the terminal cursor.
cursor_trail 1
cursor_trail_decay 0.1 0.4

# =====----- Feature Toggles --------------------------------------------===== #

# Enable or disable specific features.
allow_hyperlinks yes
confirm_os_window_close -2
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# Notify when a command of 15 s or more finishes in a tab you are not looking
# at (needs shell_integration).
notify_on_cmd_finish invisible 15

# URL handling.
url_style curly
open_url_with default
detect_urls yes
show_hyperlink_targets yes

# Copy selection immediately (tmux-style).
copy_on_select yes

# Trim trailing spaces on copy/paste operations.
strip_trailing_spaces smart

# =====----- Remote Control ---------------------------------------------===== #

# Remote control over the socket only. Every local caller (kitty @, the
# ksave/krest helpers, nnn's preview-tui) goes through $KITTY_LISTEN_ON, so
# control sequences printed by programs, including over SSH, are refused.
allow_remote_control socket-only
# A relative path lands in the per-user temporary directory; kitty appends -PID.
listen_on unix:kitty

# =====----- Resize Behavior --------------------------------------------===== #

# Customize the behavior of the terminal when resizing.
resize_debounce_time 0.1 0.5

# =====----- Tab Bar ----------------------------------------------------===== #

# tab_bar.py draws the bar: session/mode badge, per-tab process icons and
# state markers, and the status widgets on the right.
tab_bar_edge bottom
tab_bar_style custom
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_margin_width 0.0
tab_bar_margin_height 6.0 6.0

# Show only the tabs of the current session (or of no session).
tab_bar_filter session:~ or session:^$

# Longest title tab_bar.py draws, in cells, before it shortens it.
tab_title_max_length 25

# tab_bar.py draws its own bell and activity markers. kitty only tracks
# activity while tab_activity_symbol is set, so it stays set; the symbol itself
# only shows if kitty falls back to a built-in style.
tab_activity_symbol "• "
bell_on_tab no

# Only used if tab_bar.py fails and kitty falls back to a built-in style.
tab_title_template "{index} {title}"

# =====----- Terminal Identification ------------------------------------===== #

# Set the terminal identification string.
term xterm-kitty

# =====----- Cursor Behavior --------------------------------------------===== #

# Customize the appearance and behavior of the terminal cursor.
shell_integration enabled
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# =====----- Scrollback Buffer ------------------------------------------===== #

# Configure the scrollback buffer settings.
scrollback_lines 10000
# Open the pager at the line currently on screen instead of at the end.
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes

# =====----- Color Scheme -----------------------------------------------===== #

# Themes live in ./themes. Change the include below to switch theme.
include ./themes/tokyo-night.conf

# =====----- Keybindings ------------------------------------------------===== #

# Tabs and windows (platform-specific mod keys live in platform/*.conf).
# Common (non-CMD/Super) bindings stay here.

# Text navigation
map alt+left  send_text all \x1b[1;3D
map alt+right send_text all \x1b[1;3C

# Clipboard operations (platform mods in platform/*.conf).
map ctrl+shift+s paste_from_selection
map shift+insert paste_from_selection

# Scrolling.
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end
map ctrl+shift+h         show_scrollback

# Window management.
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window
map ctrl+shift+f     move_window_forward
map ctrl+shift+b     move_window_backward
map ctrl+shift+`     move_window_to_top
map ctrl+shift+1     first_window
map ctrl+shift+2     second_window
map ctrl+shift+3     third_window
map ctrl+shift+4     fourth_window
map ctrl+shift+5     fifth_window
map ctrl+shift+6     sixth_window
map ctrl+shift+7     seventh_window
map ctrl+shift+8     eighth_window
map ctrl+shift+9     ninth_window
map ctrl+shift+0     tenth_window

# Give up on an unfinished multi-key sequence (cmd+shift+s>..., ...) after 3 s.
map_timeout 3.0

# Tab prefix, tmux style: press ctrl+shift+a, then one key. The tab bar badge
# reads PREFIX while it waits; the mode ends after one action, on any other
# key, or after 2 s. herdr owns ctrl+a and tmux ctrl+q, so neither clashes.
# kitty's own ctrl+shift+a>m/l/1/d opacity sequences move into the mode.
map ctrl+shift+a>m
map ctrl+shift+a>l
map ctrl+shift+a>1
map ctrl+shift+a>d
map --new-mode prefix --on-action end --on-unknown end --timeout 2.0 ctrl+shift+a
map --mode prefix esc pop_keyboard_mode

# Tabs: jump, cycle, create, pick from a list, rename.
map --mode prefix 1 goto_tab 1
map --mode prefix 2 goto_tab 2
map --mode prefix 3 goto_tab 3
map --mode prefix 4 goto_tab 4
map --mode prefix 5 goto_tab 5
map --mode prefix 6 goto_tab 6
map --mode prefix 7 goto_tab 7
map --mode prefix 8 goto_tab 8
map --mode prefix 9 goto_tab 9
map --mode prefix 0 goto_tab 10
map --mode prefix n next_tab
map --mode prefix p previous_tab
map --mode prefix c launch --type=tab --cwd=current
map --mode prefix w select_tab
map --mode prefix , set_tab_title

# Layouts and sessions (s opens a picker over sessions/).
map --mode prefix l     next_layout
map --mode prefix enter toggle_layout stack
map --mode prefix z     toggle_layout stack
map --mode prefix s     goto_session ~/.config/kitty/sessions

# Windows: arrows focus a neighbour, shift+arrows move the window, r resizes,
# x closes after confirming.
map --mode prefix left        neighboring_window left
map --mode prefix right       neighboring_window right
map --mode prefix up          neighboring_window up
map --mode prefix down        neighboring_window down
map --mode prefix shift+left  move_window left
map --mode prefix shift+right move_window right
map --mode prefix shift+up    move_window up
map --mode prefix shift+down  move_window down
map --mode prefix r           start_resizing_window
map --mode prefix x           close_window_with_confirmation

# On macOS skhd takes ctrl+shift+h/j/k/l for yabai stacking, so kitty never
# sees ctrl+shift+h (scrollback) or ctrl+shift+l (layout); both live here too.
map --mode prefix h show_scrollback

# Background opacity.
map --mode prefix equal set_background_opacity +0.05
map --mode prefix minus set_background_opacity -0.05
map --mode prefix d     set_background_opacity default

# Tab management.
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+t     new_tab
map ctrl+shift+q     close_tab
map ctrl+shift+l     next_layout
map ctrl+shift+.     move_tab_forward
map ctrl+shift+,     move_tab_backward

# Font size.
map ctrl+shift+equal     increase_font_size
map ctrl+shift+plus      increase_font_size
map ctrl+shift+minus     decrease_font_size
map ctrl+shift+backspace restore_font_size

# Configuration reload.
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config

# =====----- Advanced Kitten Config -------------------------------------===== #

# Customize hints appearance.
action_alias hints_open kitten hints --hints-offset=0 --alphabet=asdfghjklqwertyuiopzxcvbnm

# =====----- OS-specific Overrides --------------------------------------===== #

# Load overrides based on the detected platform (KITTY_OS = linux | macos).
include ./platform/${KITTY_OS}.conf

# =====------------------------------------------------------------------===== #
# Claude AI Terminal Configuration
map shift+enter send_text all \e\r
