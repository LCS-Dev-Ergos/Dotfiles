# =====--------------------------------------------------------------------=====
# HYDE IDLE POLICY
#
# Dim, lock and disable the display while respecting inhibitors. Automatic
# suspend remains disabled pending physical resume qualification.
# =====--------------------------------------------------------------------=====

general {
    lock_cmd = hyde-shell lockscreen.sh
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
# The former 900-second battery suspend is retained in reference/, pending resume qualification.
